<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <linearGradient id="emblem-red-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A67" />
      <stop offset="60%" stop-color="#E53945" />
      <stop offset="100%" stop-color="#B32632" />
    </linearGradient>
    <linearGradient id="emblem-orange-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA858" />
      <stop offset="100%" stop-color="#E57A2F" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Red Dynamic Arrow Swoosh -->
    <path d="M 65 5 C 105 10 135 45 135 85 C 135 125 105 145 75 145 C 50 145 35 135 25 120 C 35 125 50 128 65 128 C 95 128 115 105 115 80 C 115 50 90 28 60 25 L 85 5 Z" fill="url(#emblem-red-light)" />
    
    <!-- Inner Orange Crescent Arc -->
    <path d="M 35 30 C 15 50 15 90 35 115 C 45 130 65 138 85 138 C 70 135 55 125 45 110 C 32 90 35 60 50 42 Z" fill="url(#emblem-orange-light)" />
    
    <!-- Central Radar / Automation Rings -->
    <circle cx="70" cy="75" r="28" fill="none" stroke="#FF5A67" stroke-width="3" stroke-dasharray="14 6" opacity="0.9" />
    <circle cx="70" cy="75" r="18" fill="none" stroke="#FFA858" stroke-width="3" />
    <circle cx="70" cy="75" r="9" fill="#E53945" />
    
    <!-- Radar Sweep Node -->
    <circle cx="70" cy="66" r="3" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(155, 30)">
    <!-- Teedee EDGE Display Typography in Pure White -->
    <text x="0" y="48" font-family="'Manrope', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1.5">Teedee EDGE</text>

    <!-- AUTOMATIONS Ribbon -->
    <g transform="translate(0, 62)">
      <polygon points="0,0 230,0 245,14 230,28 0,28" fill="#B32632" />
      <text x="24" y="19" font-family="'Inter', sans-serif" font-weight="800" font-size="14.5" fill="#FFFFFF" letter-spacing="4.5">AUTOMATIONS</text>
    </g>

    <!-- Legal Credential (RC: 8231485) in Light Gray -->
    <text x="255" y="82" font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="700" font-size="13" fill="#94A3B8" letter-spacing="1">RC: 8231485</text>
  </g>
</svg>
