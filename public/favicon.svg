<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A67" />
      <stop offset="60%" stop-color="#E53945" />
      <stop offset="100%" stop-color="#B32632" />
    </linearGradient>
    <linearGradient id="fav-orange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA858" />
      <stop offset="100%" stop-color="#E57A2F" />
    </linearGradient>
  </defs>

  <!-- Dark Circular Background for contrast -->
  <rect width="160" height="160" rx="36" fill="#17191D" />

  <!-- Center Emblem Group -->
  <g transform="translate(10, 5)">
    <!-- Outer Red Dynamic Arrow Swoosh -->
    <path d="M 65 5 C 105 10 135 45 135 85 C 135 125 105 145 75 145 C 50 145 35 135 25 120 C 35 125 50 128 65 128 C 95 128 115 105 115 80 C 115 50 90 28 60 25 L 85 5 Z" fill="url(#fav-red)" />
    
    <!-- Inner Orange Crescent Arc -->
    <path d="M 35 30 C 15 50 15 90 35 115 C 45 130 65 138 85 138 C 70 135 55 125 45 110 C 32 90 35 60 50 42 Z" fill="url(#fav-orange)" />
    
    <!-- Central Radar / Automation Rings -->
    <circle cx="70" cy="75" r="28" fill="none" stroke="#FF5A67" stroke-width="3" stroke-dasharray="14 6" opacity="0.9" />
    <circle cx="70" cy="75" r="18" fill="none" stroke="#FFA858" stroke-width="3" />
    <circle cx="70" cy="75" r="9" fill="#E53945" />
    
    <!-- Radar Node -->
    <circle cx="70" cy="66" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
