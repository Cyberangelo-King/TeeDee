name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/website-phase-1"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile with declared overrides
        if: github.event_name == 'pull_request'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile with patched PostCSS"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: npm audit --json > npm-audit.json || true
      - name: Show dependency audit summary
        run: node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata, vulnerabilities:a.vulnerabilities}, null, 2))"
      - name: Build website
        run: npm run build
