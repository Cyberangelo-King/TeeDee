name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/website-phase-1"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: npm audit --json > npm-audit.json || true
      - name: Show dependency audit summary
        run: node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata, vulnerabilities:a.vulnerabilities}, null, 2))"
      - name: Build website
        run: npm run build
